name: Native Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version."
          }

      - name: Build native release artifacts
        shell: pwsh
        run: npm run dist:native

      - name: Create GitHub Release and upload binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $dist = Join-Path $PWD "native\dist"
          $assets = @(
            (Join-Path $dist "VervormdeSkermNative-v$version-win-x64.exe"),
            (Join-Path $dist "VervormdeSkermNative-v$version-win-x64.exe.sha256"),
            (Join-Path $dist "Vervormde-Skerm-Native-v$version-win-x64.zip"),
            (Join-Path $dist "Vervormde-Skerm-Native-v$version-win-x64.zip.sha256")
          )

          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Missing release asset: $asset"
            }
          }

          $lines = @(Get-Content CHANGELOG.md)
          $start = -1
          for ($index = 0; $index -lt $lines.Count; $index++) {
            if ($lines[$index] -match "^## $([Regex]::Escape($version))(?: |$)") {
              $start = $index
              break
            }
          }
          if ($start -lt 0) {
            throw "CHANGELOG.md has no section for $version."
          }

          $end = $lines.Count
          for ($index = $start + 1; $index -lt $lines.Count; $index++) {
            if ($lines[$index] -match '^## ') {
              $end = $index
              break
            }
          }

          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes-$version.md"
          $lines[($start + 1)..($end - 1)] | Set-Content -LiteralPath $notesPath -Encoding UTF8

          gh release create $tag --verify-tag --latest --title "Vervormde Skerm v$version" --notes-file $notesPath @assets
